[package]
name = "sunscreen"
version = "0.1.0"
edition = "2021"
description = "Solana CLI scaffolding & orchestration tool"
license = "Apache-2.0"
repository = "https://github.com/Pantani/sunscreen"
homepage = "https://github.com/Pantani/sunscreen"
readme = "README.md"
keywords = ["solana", "cli", "scaffolding"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "sunscreen"
path = "src/main.rs"

[lib]
name = "sunscreen"
path = "src/lib.rs"

[features]
default = ["onboarding"]
onboarding = []

[lints.clippy]
cognitive_complexity = "deny"

[[test]]
name = "render_basic"
path = "tests/golden/render_basic.rs"

[[test]]
name = "render_workspace"
path = "tests/golden/render_workspace.rs"

[[test]]
name = "render_instruction"
path = "tests/golden/render_instruction.rs"

[[test]]
name = "render_program"
path = "tests/golden/render_program.rs"

[[test]]
name = "render_account"
path = "tests/golden/render_account.rs"

[[test]]
name = "render_event"
path = "tests/golden/render_event.rs"

[[test]]
name = "render_error"
path = "tests/golden/render_error.rs"

[[test]]
name = "render_instruction_matrix"
path = "tests/golden/render_instruction_matrix.rs"

[[test]]
name = "render_program_matrix"
path = "tests/golden/render_program_matrix.rs"

[[bench]]
name = "cold_start"
path = "benches/cold_start.rs"
harness = false

[dependencies]
# cli-architect (base)
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# config-engineer
serde_yaml = "0.9"
schemars = "0.8"

# toolchain-detector
which = "6"
regex = "1"
comfy-table = "7"
owo-colors = "4"
semver = "1"

# template-engineer
rust-embed = "8"
minijinja = "2"
heck = "0.5"
indexmap = { version = "2", features = ["serde"] }
once_cell = "1"

# cli-architect (Phase 1) — needed by `chain new --dry-run` staging.
tempfile = "3"

# runtime-orchestrator (Phase 3)
notify = "8.2"
ctrlc = "3"
nix = { version = "0.31", features = ["signal", "process"] }

[dev-dependencies]
tempfile = "3"
insta = { version = "1", features = ["json"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Profile used by cargo-dist for release builds.
[profile.dist]
inherits = "release"
lto = "thin"

# cargo-dist configuration. See https://opensource.axo.dev/cargo-dist/
[workspace.metadata.dist]
cargo-dist-version = "0.22.1"
ci = ["github"]
installers = ["shell", "homebrew"]
tap = "Pantani/homebrew-sunscreen"
formula = "sunscreen"
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
pr-run-mode = "plan"
install-updater = false
allow-dirty = ["ci"]

# Debian packaging metadata consumed by `cargo deb`.
# See https://github.com/kornelski/cargo-deb
[package.metadata.deb]
maintainer = "Pantani <noreply@github.com>"
copyright = "2026 Pantani, Apache-2.0"
extended-description = """\
Sunscreen is a Rust CLI for scaffolding Anchor and Pinocchio programs on \
Solana, orchestrating local validators, and generating frontend clients via \
Codama. Inspired by Ignite CLI for Cosmos."""
section = "devel"
priority = "optional"
assets = [
    ["target/release/sunscreen", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/sunscreen/README.md", "644"],
    ["CHANGELOG.md", "usr/share/doc/sunscreen/CHANGELOG.md", "644"],
]
