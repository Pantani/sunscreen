name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  MDBOOK_VERSION: "0.4.40"
  MDBOOK_ADMONISH_VERSION: "1.18.0"
  MDBOOK_MERMAID_VERSION: "0.14.0"
  MDBOOK_LINKCHECK_VERSION: "0.7.7"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo bin
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: mdbook-${{ env.MDBOOK_VERSION }}-${{ env.MDBOOK_ADMONISH_VERSION }}-${{ env.MDBOOK_MERMAID_VERSION }}-${{ env.MDBOOK_LINKCHECK_VERSION }}

      - name: Install mdBook toolchain
        run: |
          set -euo pipefail
          install_if_missing() {
            local crate="$1" version="$2"
            if ! command -v "$crate" >/dev/null 2>&1; then
              cargo install --locked --version "$version" "$crate"
            fi
          }
          install_if_missing mdbook "$MDBOOK_VERSION"
          install_if_missing mdbook-admonish "$MDBOOK_ADMONISH_VERSION"
          install_if_missing mdbook-mermaid "$MDBOOK_MERMAID_VERSION"
          install_if_missing mdbook-linkcheck "$MDBOOK_LINKCHECK_VERSION"

      - name: Build
        run: mdbook build docs/site

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/book/html

  deploy:
    name: Deploy
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
