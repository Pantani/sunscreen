[book]
title = "Sunscreen"
description = "A Rust CLI for scaffolding, repairing, and orchestrating Solana Anchor and Pinocchio workspaces."
authors = ["The Sunscreen Contributors"]
language = "en"
multilingual = false
src = "src"

[rust]
edition = "2021"

[build]
build-dir = "book"
create-missing = false

[preprocessor.admonish]
command = "mdbook-admonish"
assets_version = "3.0.2"

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
default-theme = "sunscreen-dark"
preferred-dark-theme = "sunscreen-dark"
git-repository-url = "https://github.com/Pantani/sunscreen"
git-repository-icon = "fa-github"
edit-url-template = "https://github.com/Pantani/sunscreen/edit/main/docs/site/{path}"
site-url = "/sunscreen/"
cname = ""
additional-css = [
    "theme/css/variables.css",
    "theme/css/general.css",
    "theme/css/admonish.css",
]
additional-js = ["theme/js/mermaid-init.js"]
no-section-label = false
mathjax-support = false
copy-fonts = true

[output.html.fold]
enable = true
level = 1

[output.html.print]
enable = true

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[output.linkcheck]
follow-web-links = false
warning-policy = "error"
exclude = ["github\\.com/Pantani/sunscreen/edit/main/.*"]
